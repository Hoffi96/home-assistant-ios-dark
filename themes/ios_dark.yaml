ios_dark:
  # iOS Liquid Glass - Grundfarben
  primary-color: "#0A84FF"
  accent-color: "#0A84FF"
  state-icon-active-color: "#0A84FF"

  # Hintergrund
  background: "#000000"
  primary-background-color: "#000000"
  secondary-background-color: "#000000"
  card-background-color: "rgba(28, 28, 30, 0.55)"

  # Text
  primary-text-color: "#FFFFFF"
  secondary-text-color: "rgba(235, 235, 245, 0.60)"
  text-primary-color: "#FFFFFF"
  disabled-text-color: "rgba(235, 235, 245, 0.30)"

  # Oberflaechen
  divider-color: "rgba(84, 84, 88, 0.65)"
  outline-color: "rgba(255, 255, 255, 0.10)"
  paper-item-background-color: "rgba(28, 28, 30, 0.55)"
  paper-card-background-color: "rgba(28, 28, 30, 0.55)"
  sidebar-background-color: "rgba(10, 10, 10, 0.72)"
  app-header-background-color: "rgba(10, 10, 10, 0.72)"
  app-header-text-color: "#FFFFFF"

  # Liquid Glass Tokens
  glass-bg: "rgba(255, 255, 255, 0.08)"
  glass-blur: "blur(24px) saturate(180%)"
  glass-border: "1px solid rgba(255, 255, 255, 0.14)"
  glass-shadow: "0 10px 32px rgba(0, 0, 0, 0.38)"
  glass-radius: "24px"

  # Karten
  ha-card-background: "rgba(255, 255, 255, 0.08)"
  ha-card-border-color: "rgba(255, 255, 255, 0.14)"
  ha-card-border-radius: "24px"
  ha-card-box-shadow: "0 10px 32px rgba(0, 0, 0, 0.38)"
  ha-card-padding: "18px"
  ha-card-backdrop-filter: "blur(24px) saturate(180%)"

  # Interaktion
  primary-color-dark: "#0A84FF"
  light-primary-color: "#0A84FF"
  paper-item-selected-background-color: "rgba(255, 255, 255, 0.10)"
  state-icon-color: "rgba(235, 235, 245, 0.60)"
  switch-checked-color: "#30D158"
  switch-unchecked-color: "rgba(120, 120, 128, 0.32)"
  slider-bar-color: "rgba(120, 120, 128, 0.32)"
  slider-main-color: "#0A84FF"

  # Statusfarben
  success-color: "#30D158"
  warning-color: "#FF9F0A"
  error-color: "#FF453A"
  info-color: "#0A84FF"

  # Typografie
  primary-font-family: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif"
  paper-font-common-base: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif"
  paper-font-common-code: "SF Mono, Menlo, Consolas, monospace"
  header-font-weight: "600"
  h1-font-size: "30px"
  h2-font-size: "22px"
  h3-font-size: "18px"

  # Liquid Glass fuer alle Standardkarten
  # Benoetigt card-mod (HACS)
  card-mod-card: |
    ha-card {
      background: rgba(255, 255, 255, 0.08) !important;
      backdrop-filter: blur(24px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
      border: 1px solid rgba(255, 255, 255, 0.14) !important;
      border-radius: 24px !important;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.38) !important;
      overflow: hidden;
    }

    ha-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.16) 0%,
        rgba(255, 255, 255, 0.04) 38%,
        rgba(255, 255, 255, 0.00) 70%
      );
      pointer-events: none;
    }
